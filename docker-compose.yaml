services:
  pyrmqtt:
    image: ghcr.io/krazy998/pyraven-mqtt:latest
    # Uncomment to build locally instead of pulling from GHCR:
    # build: .
    container_name: pyrmqtt
    restart: always
    devices:
      # Map your RAVEn USB stick by stable /dev/serial/by-id path
      - /dev/serial/by-id/usb-Rainforest_RFA-Z106-RA-PC_RAVEn_v2.3.21-if00-port0:/serial
    environment:
      RAVEN_DEVICE: "/serial"

      # --- MQTT config ---
      MQTT_HOST: "192.168.1.10"
      MQTT_PORT: "1883"
      MQTT_USERNAME: "yourusername"
      MQTT_PASSWORD: "yourpassword"
      # MQTT_TOPIC: "raven"
      # MQTT_TLS: "false"

      # --- PVOutput uploader (optional) ---
      PVOUTPUT_ENABLED: "false"        # set "true" to enable
      PVOUTPUT_API_KEY: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      PVOUTPUT_SYSTEM_ID: "12345"
      PVOUTPUT_NET: "0"                # 0 = gross (v4 only), 1 = net (v2 export + v4 import)
      PVOUTPUT_INTERVAL_SECONDS: "300" # 300 = 5 min (PVOutput standard interval)
      PVOUTPUT_MQTT_TOPIC: "raven/sensor/telemetry"

      # --- Fronius voltage source (optional) ---
      FRONIUS_HOST: "192.168.1.10"
      FRONIUS_DEVICE_ID: "1"
      # FRONIUS_USERNAME: ""
      # FRONIUS_PASSWORD: ""

      # --- Misc ---
      TZ: "Australia/Melbourne"        # PVOutput uses local date/time
      LOG_LEVEL: "INFO"
